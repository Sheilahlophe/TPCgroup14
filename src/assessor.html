<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learner Support System | Assessor Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- JavaScript builds the shared page layout and assessor tools here. -->
  <div id="app">
    <div class="loading-state" role="status" aria-live="polite">
      <span class="loading-spinner" aria-hidden="true"></span>
      <span>Loading page...</span>
    </div>
  </div>
  <script type="module">
    import { requireAuth, renderShell } from "./js/app.js";
    import { initAssessor } from "./js/assessor.js";
    // Only allow assessor accounts to open this page.
    requireAuth("assessor");
    // Show the shared navigation and assessor dashboard.
    renderShell("assessor");
    initAssessor();
  </script>
</body>
</html>
