<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learner Support System | Resources</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- JavaScript builds the shared page layout and resources here. -->
  <div id="app">
    <div class="loading-state" role="status" aria-live="polite">
      <span class="loading-spinner" aria-hidden="true"></span>
      <span>Loading page...</span>
    </div>
  </div>
  <script type="module">
    import { requireAuth, renderShell } from "./js/app.js";
    import { initResources } from "./js/resources.js";
    // Require a signed-in user, whether learner or assessor.
    requireAuth();
    // Show the shared navigation and learning resources.
    renderShell("resources");
    initResources();
  </script>
</body>
</html>
