<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learner Support System | Support Booking</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- JavaScript builds the shared page layout and booking form here. -->
  <div id="app">
    <div class="loading-state" role="status" aria-live="polite">
      <span class="loading-spinner" aria-hidden="true"></span>
      <span>Loading page...</span>
    </div>
  </div>
  <script type="module">
    import { requireAuth, renderShell } from "./js/app.js";
    import { initBooking } from "./js/booking.js";
    // Only allow learners to request support sessions.
    requireAuth("learner");
    // Show the shared navigation and booking page.
    renderShell("booking");
    initBooking();
  </script>
</body>
</html>
